<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/chat.css">
</head>
<body>
  <div class="shell">
  <aside class="chats" aria-label="Chats">
    <button type="button" id="new-chat" class="new-chat">Nuevo</button>
    <ul id="chat-list"></ul>
  </aside>
  <div class="app">
    <header class="bar">
      <span class="avatar" aria-hidden="true">P</span>
      <div class="identity">
        <h1>PAP</h1>
        <p id="chat-title">Chat nuevo</p>
      </div>
    </header>
    <main id="log" class="log" aria-live="polite">
      <p id="empty" class="empty">Pregunta en español. Si pides un dashboard, la respuesta trae tablas y gráficas.</p>
    </main>
    <form id="composer" class="composer">
      <label class="sr" for="input">Mensaje</label>
      <textarea id="input" rows="1" placeholder="Escribe una pregunta" required></textarea>
      <button type="submit" aria-label="Enviar">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.min.js"></script>
  <script src="/scripts/chat.js"></script>
</body>
</html>
